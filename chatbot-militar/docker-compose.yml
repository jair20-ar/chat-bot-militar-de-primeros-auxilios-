version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: chatbot_militar
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chatbot2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_militar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://chatbot:${DB_PASSWORD:-chatbot2026}@postgres:5432/chatbot_militar
      JWT_SECRET: ${JWT_SECRET:-fanb-secret-key-cambiame-en-produccion}
      FRONTEND_URL: http://localhost:3001
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
