<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/imagenes/escudo.jpeg">
    <title>SISTEMA DE ASISTENCIA MÉDICA TÁCTICA MILITAR!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a101a">
</head>
<body>

    <!-- Línea de Escaneo (Scanline) -->
    <div class="scanline"></div>

    <!-- HUD Corners -->
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <!-- Puntos de luz decorativos de fondo -->
    <div class="glow-point" style="top: 25%; left: 15%;"></div>
    <div class="glow-point" style="top: 68%; left: 82%;"></div>
    <div class="glow-point" style="top: 45%; left: 88%;"></div>
    <div class="glow-point" style="top: 72%; left: 12%;"></div>

    <!-- Barra Superior -->
    <header class="top-bar">
        <div class="top-status-bar">
            <span class="status-dot"></span>
            <span class="status-text">SISTEMA ACTIVO</span>
            <span class="status-brand">
                <svg width="10" height="12" viewBox="0 0 24 24" fill="#00e5ff" stroke="#00e5ff" stroke-width="1" style="vertical-align: middle; margin-right: 2px;">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                X-60
            </span>
        </div>
        <!-- Botón Sol (Arriba Derecha) -->
        <div class="top-right-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </div>
    </header>

    <!-- Contenido Central -->
    <main class="main-container">
        
        <!-- Escudo Principal -->
        <div class="shield-glow-container">
            <div class="radar-sweep"></div>
            <div class="radar-ring r1"></div>
            <div class="radar-ring r2"></div>
            <div class="radar-ring r3"></div>
            <div class="shield-core">
                <img src="../imagenes/escudo.jpeg" alt="X-60" class="shield-img">
            </div>
        </div>

        <!-- Títulos -->
        <h1 class="title-main">
            X-60
        </h1>
        <p class="subtitle">Sistema de Asistencia Médica Táctica</p>


        <!-- Contenedor de Tarjetas Principales -->
        <div class="cards-container drag-scroll">
            <!-- BOTÓN 1: Instrucciones (Redirige a buscador.html) -->
            <button class="action-card card-primary" onclick="window.location.href='buscador.html'">
                <div class="card-led led-cyan"></div>
                <div class="card-icon-wrapper icon-primary">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                </div>
                <div class="card-text">
                    INSTRUCCIONES MÉDICAS<br>INMEDIATAS
                </div>
                <div class="card-subtext">
                    Guía paso a paso - Primeros Auxilios
                </div>
            </button>

            <!-- BOTÓN 2: Acceso Médico (Redirige a medicos.html) -->
            <button class="action-card card-secondary" onclick="window.location.href='medicos.html'">
                <div class="card-led led-green"></div>
                <div class="card-icon-wrapper icon-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <div class="card-text">
                    ACCESO PERSONAL<br>MÉDICO EXCLUSIVO
                </div>
                <div class="card-subtext">
                    Panel Médico - Crear Protocolos
                </div>
            </button>
        </div>

    </main>

    <!-- Barra Inferior -->
    <footer class="bottom-bar">
        <div class="bottom-status-bar">
            <div class="bottom-status-left">
                <span class="dot-indicators">
                    <span class="ind-dot active"></span>
                    <span class="ind-dot active"></span>
                    <span class="ind-dot active"></span>
                </span>
                <span class="bottom-status-text">MODO OPERATIVO</span>
            </div>
            <div class="bottom-status-right">
                <span class="version-text">v2.0</span>
                <span class="dot-separator">•</span>
                <span class="brand-text">X-60</span>
            </div>
        </div>
    </footer>

    <!-- SECCIÓN DE INFORMACIÓN ADICIONAL (OCULTADA POR DEFECTO PARA EL DISEÑO DE CONSOLA DE UNA PANTALLA) -->

    <!-- Botón Ayuda (Abajo Derecha) -->
    <div class="bottom-right-btn">?</div>

    <script src="../js/db-local.js"></script>
    <script src="../js/sync.js"></script>
    <script src="../js/gestures.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
      if (typeof SyncEngine !== 'undefined') SyncEngine.init();
