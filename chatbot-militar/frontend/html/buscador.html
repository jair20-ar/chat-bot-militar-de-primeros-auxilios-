<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/imagenes/escudo.jpeg">
    <title>BÚSQUEDA MÉDICA TÁCTICA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/buscador.css">
</head>
<body>

    <div class="container">
        
        <div class="header-area">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='/'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h2>BÚSQUEDA MÉDICA</h2>
            </div>
            
            <button class="theme-btn">
                <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>

        <div class="search-card">
            
            <div class="instruction-row">
                <div class="search-title-icon-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <span>Describe la emergencia o condición médica</span>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="search" placeholder="Ej: herida de bala, fractura, hemorragia..." onkeypress="handleEnter(event)">
                    <span class="search-inner-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                </div>
                
                <button class="mic-btn" id="voice-card" title="Buscar por voz">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
            </div>

            <button class="btn-submit" id="btn-resultados" onclick="handleSearch()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                BUSCAR INSTRUCCIONES
            </button>

        </div>

        <div class="anatomical-section">
            <div class="anatomical-title">SELECCIÓN DE ÁREA CORPORAL</div>
            <div class="figure-container">
                <div class="zone-btns-left">
                    <button class="zone-btn" data-search="cabeza">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 5.5v3a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3c1.5-1 3-3 3-5.5a7 7 0 0 0-7-7Z" />
                            <path d="M9 10a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1ZM15 10a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1Z" />
                            <path d="M10 14h4M12 14v4" />
                        </svg>
                        <span>CABEZA</span>
                    </button>
                    <button class="zone-btn" data-search="cuello">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M12 2v20M6 8h12M7 14h10" />
                            <path d="M8 4c0 4-2 6-2 10a6 6 0 0 0 12 0c0-4-2-6-2-10Z" />
                        </svg>
                        <span>CUELLO</span>
                    </button>
                    <button class="zone-btn" data-search="torax">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M6 3h12l2 4-2 7v7H6v-7L4 7Z" />
                            <path d="M12 3v18" />
                            <path d="M6 8h12M6 13h12" />
                        </svg>
                        <span>TÓRAX</span>
                    </button>
                    <button class="zone-btn" data-search="abdomen">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M5 3h14l-1 8-1 9H7l-1-9Z" />
                            <path d="M12 3v17" />
                            <path d="M6 10h12M7 15h10" />
                        </svg>
                        <span>ABDOMEN</span>
                    </button>
                </div>
                
                <div class="body-image">
                    <img src="../imagenes/anatomia_dark.png" alt="Anatomía Médica" class="anatomy-display-img">
                </div>
                
                <div class="zone-btns-right">
                    <button class="zone-btn" data-search="brazos">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M15 14a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4h-2Z" />
                            <path d="M9 14a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H8a4 4 0 0 0-4 4v2a4 4 0 0 0 4 4h2Z" />
                        </svg>
                        <span>BRAZOS</span>
                    </button>
                    <button class="zone-btn" data-search="manos">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5m0 0V5a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6m0 0V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6m0 0V9a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8a7 7 0 0 0 7 7h4a7 7 0 0 0 7-7v-6" />
                        </svg>
                        <span>MANOS</span>
                    </button>
                    <button class="zone-btn" data-search="piernas">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M6 3h4l1 5 1 5-1 6-2 2H6l-1-7 1-5Z" />
                            <path d="M18 3h-4l-1 5-1 5 1 6 2 2h3l1-7-1-5Z" />
                        </svg>
                        <span>PIERNAS</span>
                    </button>
                    <button class="zone-btn" data-search="pies">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
                            <path d="M3 17a2 2 0 0 1 2-2h1l3-4c1-1 2-2 4-2a4 4 0 0 1 4 4v1a4 4 0 0 1-4 4H5a2 2 0 0 1-2-2Z" />
                            <circle cx="15" cy="8" r="1" />
                        </svg>
                        <span>PIES</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

<script src="../js/buscador.js"></script>
<script src="../js/gestures.js"></script>
</body>
</html>
