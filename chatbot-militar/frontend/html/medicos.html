<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Médico | TACMED FANB</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/medicos.css">
</head>
<body>

    <header>
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='/'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="header-title">ACCESO MÉDICO</div>
        </div>
        <button class="theme-btn">
            <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
    </header>

    <main>
        <div class="shield-icon-container">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><rect x="9" y="9" width="6" height="8" rx="2"/><path d="M12 13v2"/></svg>
        </div>
        
        <h1>PERSONAL MÉDICO AUTORIZADO</h1>
        <p class="subtitle">Ingrese sus credenciales de acceso</p>

        <div class="login-card">
            <div class="alert-message" id="alertMessage"></div>

            <form id="login-form">
                
                <div class="form-group">
                    <div class="form-label">
                        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        Usuario (ID Médico)
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="id_medico" placeholder="Ingrese su cédula o ID" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Contraseña
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    INICIAR SESIÓN
                </button>

                <div class="demo-text">Demo: <span>1234567890</span> / <span>password123</span></div>

                <div class="register-container">
                    <div class="register-label">¿No tiene una cuenta?</div>
                    <button type="button" class="register-link-btn" onclick="window.location.href='registro.html'">
                        REGISTRARSE COMO PERSONAL MÉDICO
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- MODAL DE BIENVENIDA -->
    <div class="welcome-modal" id="welcomeModal">
        <div class="welcome-content">
            <div class="welcome-icon">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="welcome-title">¡BIENVENIDO!</div>
            <div class="welcome-name" id="welcomeName"></div>
            <div class="welcome-loading">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        </div>
    </div>

    <script src="../js/medicos.js"></script>
    <script src="../js/gestures.js"></script>
</body>
</html>
