<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROTOCOLO MÉDICO | MEDIC-BOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/instrucciones.css">
    <link rel="stylesheet" href="../styles/themes.css">
</head>
<body>

    <div class="app-container">
        
        <header class="header">
            <div class="header-left">
                <button class="icon-btn" onclick="window.history.back()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="titles">
                    <span id="titulo-tipo">PROTOCOLO MÉDICO</span>
                    <h1 id="titulo-instruccion">Cargando...</h1>
                </div>
            </div>
            <button class="icon-btn">
                <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </header>

        <div class="visual-area">
            <div class="hud-scanner-container">
                <div class="scanner-ring scanner-ring-outer"></div>
                <div class="scanner-ring scanner-ring-inner"></div>
                <div class="avatar-circle" id="visual-content">
                    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.97/build/spline-viewer.js"></script>
                    <spline-viewer url="https://prod.spline.design/y4qP8PeEqQ3hrY-D/scene.splinecode"></spline-viewer>
                </div>
            </div>
            
            <div class="view-toggle">
                <button class="active" id="btn-vista-3d" onclick="toggleView('3d', this)">Modelo 3D</button>
                <span class="separator">-</span>
                <button id="btn-vista-img" onclick="toggleView('img', this)">Imagen</button>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-labels">
                <span><span class="highlight">⚡ Paso <span id="paso-actual">1</span></span> de <span id="total-pasos">1</span></span>
                <span class="highlight" id="tiempo-actual">0:00</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>

        <div class="playback-controls">
            <button class="icon-btn" id="btn-retroceder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
            </button>
            
            <button class="play-btn" id="btn-pausa" onclick="togglePlayPause()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            
            <button class="icon-btn voice-btn" id="btn-voz" onclick="toggleMute()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
        </div>

        <div id="contenedor-principal">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando instrucción...</p>
            </div>
        </div>

    </div>

    <!-- Modal de Finalización Táctica -->
    <div class="tactical-modal-overlay" id="end-protocol-modal">
        <div class="tactical-modal">
            <div class="modal-corner top-left"></div>
            <div class="modal-corner top-right"></div>
            <div class="modal-corner bottom-left"></div>
            <div class="modal-corner bottom-right"></div>
            
            <div class="modal-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <h2>¡ATENCIÓN SOLDADO!</h2>
            </div>
            
            <div class="modal-body">
                <p>El protocolo de asistencia médica ha finalizado. ¿Cuáles son sus órdenes a continuación?</p>
            </div>
            
            <div class="modal-footer">
                <button class="modal-btn btn-restart" onclick="restartProtocol()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                    REPETIR INSTRUCCIÓN
                </button>
                <button class="modal-btn btn-exit" onclick="exitProtocol()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    TERMINAR INSTRUCCIÓN
                </button>
            </div>
        </div>
    </div>

    <div class="help-btn">?</div>

    <script src="../js/instrucciones.js"></script>
    <script src="../js/gestures.js"></script>
    <script>
        const eliminarLogoSpline = setInterval(() => {
            const viewer = document.querySelector('spline-viewer');
            
            if (viewer && viewer.shadowRoot) {
                const logo = viewer.shadowRoot.querySelector('#logo');
                
                if (logo) {
                    logo.remove();
                    clearInterval(eliminarLogoSpline);
                }
            }
        }, 100);

        setTimeout(() => clearInterval(eliminarLogoSpline), 10000);
    </script>
</body>
</html>
