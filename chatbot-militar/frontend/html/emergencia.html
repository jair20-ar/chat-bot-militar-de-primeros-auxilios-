<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/imagenes/escudo.jpeg">
    <title>Crear Instrucción Médica - FANB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/emergencia.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a101a">
</head>
<body>

    <header>
        <div class="header-left">
            <button class="btn-back" onclick="window.history.back()" aria-label="Volver">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="title-container">
                <h1 id="page-title">CREAR INSTRUCCIÓN</h1>
                <div class="title-underline"></div>
            </div>
        </div>
    </header>

    <main>
        <section class="card card-general">
            <div class="section-header">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                INFORMACIÓN GENERAL
            </div>

            <div class="form-group">
                <label>Título de la Instrucción *</label>
                <input type="text" id="titulo" placeholder="Ej: Control de Hemorragia con Torniquete">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Categoría *</label>
                    <input type="text" id="categoria" placeholder="Ej: Control de Sangrado">
                </div>
                <div class="form-group">
                    <label>Nivel de Severidad *</label>
                    <select id="severidad">
                        <option value="">-- Selecciona --</option>
                        <option value="leve">Leve</option>
                        <option value="moderado">Moderado</option>
                        <option value="critico">Crítico</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Parte del Cuerpo *</label>
                    <select id="parte_cuerpo">
                        <option value="">-- Selecciona una parte --</option>
                        <option value="cabeza">Cabeza</option>
                        <option value="cuello">Cuello</option>
                        <option value="brazos">Brazos</option>
                        <option value="manos">Manos</option>
                        <option value="torax">Tórax</option>
                        <option value="abdomen">Abdomen</option>
                        <option value="piernas">Piernas</option>
                        <option value="pies">Pies</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tiempo Estimado *</label>
                    <input type="text" id="tiempo_estimado" placeholder="Ej: 5 min">
                </div>
            </div>
        </section>

        <section class="card card-general">
            <div class="section-header">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                DESCRIPCIÓN PARA EL SOLDADO
            </div>
            <div class="form-group">
                <label>Descripciones de búsqueda</label>
                <textarea id="descripcion" rows="4" placeholder="Escribe una o varias frases que describan esta instrucción en lenguaje simple, para que los soldados la encuentren al buscar.&#10;&#10;Ej: Herida por proyectil en el torso&#10;Sangrado abundante en el pecho&#10;Orificio de entrada y salida de bala&#10;Herida de arma de fuego"></textarea>
                <small style="color: var(--text-secondary, #999);">Cada línea será buscable por separado. Usa términos que un soldado sin conocimientos médicos usaría.</small>
            </div>
        </section>

        <div class="steps-header-container">
            <h2 class="steps-title">PASOS DE LA INSTRUCCIÓN</h2>
            <button class="btn-add-step" id="add-step-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                AGREGAR PASO
            </button>
        </div>

        <div id="steps-container">
            <section class="card step-card">
                <div class="step-header">
                    <div class="step-number">1</div>
                    <h3>PASO 1</h3>
                </div>

                <div class="form-group">
                    <label>Título del Paso *</label>
                    <input type="text" placeholder="Ej: Evaluación inicial de la escena">
                </div>

                <div class="form-group">
                    <label>Descripción Detallada *</label>
                    <textarea placeholder="Descripción detallada del procedimiento..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Duración (segundos)</label>
                        <input type="number" value="30">
                    </div>
                    <div class="form-group">
                        <label>Texto para Voz</label>
                        <input type="text" placeholder="Texto simplificado para síntesis de voz">
                    </div>
                </div>

                <div class="form-group">
                    <label>Imagen del Paso (opcional)</label>
                    <div class="file-input-wrapper">
                        <input type="file" accept="image/*" class="image-input">
                        <label class="file-input-label">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            <span>Selecciona una imagen o arrastra aquí</span>
                        </label>
                    </div>
                    <div class="image-preview-container">
                        <img class="image-preview" src="" alt="Preview">
                        <button type="button" class="btn-remove-image">
                            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            REMOVER IMAGEN
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <div class="btn-group">
            <button class="btn-save" id="btn-save" onclick="saveInstruction()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                GUARDAR INSTRUCCIÓN
            </button>
            <button class="btn-back-panel" onclick="window.history.back()" style="width: 100%;">
                ← VOLVER
            </button>
        </div>

    </main>

    <script src="../js/db-local.js"></script>
    <script src="../js/sync.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/emergencia.js"></script>
    <script src="../js/gestures.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
      if (typeof SyncEngine !== 'undefined') SyncEngine.init();
    </script>
</body>
</html>
