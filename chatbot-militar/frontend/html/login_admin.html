<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Restringido</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-glow-1: rgba(255, 0, 0, 0.20);
    --bg-glow-2: rgba(20, 30, 70, 0.12);

    --card-bg: #12141c;
    --card-border: rgba(255, 255, 255, 0.07);
    --input-bg: #1b1e29;

    --text-primary: #f1f2f6;
    --text-secondary: #8b93a7;
    --text-muted: #5b6275;

    --red: #ff0000;
    --red-dark: #b30000;
    --red-soft: rgba(255, 0, 0, 0.16);
    --red-border: rgba(255, 0, 0, 0.40);

    --cyan: #2dd4bf;
    --cyan-border: rgba(45, 212, 191, 0.30);

    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }

  [data-theme="light"] {
    --bg: #f4f5f8;
    --bg-glow-1: rgba(255, 0, 0, 0.12);
    --bg-glow-2: rgba(45, 212, 191, 0.06);

    --card-bg: #ffffff;
    --card-border: rgba(15, 23, 42, 0.08);
    --input-bg: #eef0f4;

    --text-primary: #1a1d29;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 50% 18%, var(--bg-glow-1), transparent 38%),
      radial-gradient(circle at 90% 90%, var(--bg-glow-2), transparent 40%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 28px;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text-secondary);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }

  .icon-btn:hover {
    color: var(--text-primary);
    transform: translateY(-1px);
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .theme-btn {
    color: var(--cyan);
    border-color: var(--cyan-border);
  }

  .theme-btn:hover {
    box-shadow: 0 0 14px rgba(45, 212, 191, 0.25);
  }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 24px 60px;
  }

  .panel {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* ---------- Radar / shield ---------- */
  .radar {
    position: relative;
    width: 110px;
    height: 110px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .radar-sweep {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 0, 0, 0.45), transparent 55%);
    filter: blur(3px);
    animation: radar-rotate 4s linear infinite;
  }

  .radar-ring {
    position: absolute;
    inset: 0;
    border: 1.5px solid rgba(255, 0, 0, 0.60);
    border-radius: 50%;
    opacity: 0;
    animation: radar-pulse 3s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
  }

  .radar-ring.r2 { animation-delay: 1s; }
  .radar-ring.r3 { animation-delay: 2s; }

  .shield-core {
    position: relative;
    z-index: 3;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #ff5050, #b30000 70%);
    color: #fff;
    animation: shield-glow 3s ease-in-out infinite;
  }

  .shield-core svg {
    width: 36px;
    height: 36px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes radar-rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes radar-pulse {
    0%   { transform: scale(0.85); opacity: 0.65; }
    70%  { opacity: 0.12; }
    100% { transform: scale(2.7); opacity: 0; }
  }

  @keyframes shield-glow {
    0%, 100% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.55), 0 0 60px rgba(255, 0, 0, 0.22); }
    50%      { box-shadow: 0 0 50px rgba(255, 0, 0, 0.85), 0 0 95px rgba(255, 0, 0, 0.45); }
  }

  @media (prefers-reduced-motion: reduce) {
    .radar-sweep, .radar-ring, .shield-core {
      animation: none;
    }
  }

  /* ---------- Title ---------- */
  .title {
    font-size: 1.45rem;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 14px;
  }

  .divider {
    width: 70px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(to right, transparent, var(--red), transparent);
    margin-bottom: 14px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }

  /* ---------- Card ---------- */
  .card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 26px;
    text-align: left;
  }

  .field-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 14px;
  }

  .field-label svg {
    width: 17px;
    height: 17px;
    stroke: var(--red);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .password-input {
    width: 100%;
    padding: 14px 46px 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--card-border);
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 1rem;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .password-input::placeholder {
    color: var(--text-muted);
    letter-spacing: normal;
  }

  .password-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.15);
  }

  .eye-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }

  .eye-btn:hover {
    color: var(--text-primary);
  }

  .eye-btn svg {
    width: 19px;
    height: 19px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Submit button ---------- */
  .submit-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px;
    border-radius: var(--radius-md);
    border: none;
    background: linear-gradient(135deg, #ff0000, #b30000);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
    box-shadow: 0 6px 20px rgba(255, 0, 0, 0.30);
  }

  .submit-btn:hover {
    filter: brightness(1.08);
    box-shadow: 0 8px 26px rgba(255, 0, 0, 0.50);
    transform: translateY(-1px);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .submit-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Help button ---------- */
  .help-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .help-btn:hover {
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.15);
  }
</style>
</head>
<body data-theme="dark">

  <div class="topbar">
    <button class="icon-btn" aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="icon-btn theme-btn" id="themeToggle" aria-label="Cambiar tema">
      <svg id="themeIcon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>
  </div>

  <div class="main">
    <div class="panel">

      <div class="radar">
        <div class="radar-sweep"></div>
        <div class="radar-ring r1"></div>
        <div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div>
        <div class="shield-core">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
      </div>

      <h1 class="title">Acceso Restringido</h1>
      <div class="divider"></div>
      <p class="subtitle">Panel de Administración — Solo Personal Autorizado</p>

      <div class="card">
        <label class="field-label" for="adminPassword">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Contraseña de Administrador
        </label>

        <div class="input-wrap">
          <input type="password" id="adminPassword" class="password-input" placeholder="••••••••••••">
          <button type="button" class="eye-btn" id="eyeToggle" aria-label="Mostrar contraseña">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <button type="button" class="submit-btn">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Ingresar al Panel
        </button>
      </div>

    </div>
  </div>

  <button class="help-btn" aria-label="Ayuda">?</button>

  <script>
    // Password show/hide toggle
    const pwInput = document.getElementById('adminPassword');
    const eyeBtn = document.getElementById('eyeToggle');
    const eyeIcon = document.getElementById('eyeIcon');

    const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeClosed = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

    eyeBtn.addEventListener('click', () => {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
      eyeBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    // Theme toggle (dark / light)
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
    const moonPath = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';

    themeToggle.addEventListener('click', () => {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeIcon.innerHTML = isDark ? moonPath : sunPath;
    });
  </script>
</body>
</html>
