services:
  - type: web
    name: chatbot-militar
    runtime: node
    rootDir: chatbot-militar/backend
    buildCommand: npm install
    startCommand: node --max-old-space-size=180 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-militar-db
          property: connectionString

databases:
  - name: chatbot-militar-db
    plan: free
    databaseName: chatbot_militar
    user: chatbot_militar_user
