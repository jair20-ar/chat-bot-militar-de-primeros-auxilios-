services:
  - type: web
    name: chatbot-militar
    runtime: node
    rootDir: chatbot-militar/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
