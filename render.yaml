services:
  - type: web
    name: chatbot-militar
    runtime: node
    rootDir: chatbot-militar/backend
    buildCommand: npm install
    startCommand: node --max-old-space-size=512 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: FRONTEND_URL
        value: https://chat-bot-militar-de-primeros-auxilios.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: chatbot-militar-db
          property: connectionString

databases:
  - name: chatbot-militar-db
    plan: free
    databaseName: chatbot_militar
    user: chatbot_militar_user
